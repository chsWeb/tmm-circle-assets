<!-- TMM signed-out door — HEAD code for the /logout page only.
     Styles Circle's own Site Builder markup. Nothing to deploy.

     No body-class scope on purpose: Circle only puts .is-signed-out
     on <body> when the visitor is signed out, so scoping to it made
     the page look unstyled for admins viewing it while logged in.
     This lives in one page's head code, so it needs no scope.

     !important is needed because Circle's builder writes inline
     styles on these elements from its design panel.

     The field colour follows var(--theme-website-color-5) — the
     section's own colour — so changing it in the builder changes
     this with it.

     The h1 rules are gone: the heading is now the logo image, so
     they matched nothing.

     Still to do in the builder: both buttons are href="#". Point
     them at /sign_in#email and /signup. -->
<style>
  @font-face{font-family:'TMM Sweet Sans';src:url('https://tmm-circle-assets.pages.dev/home/fonts/SweetSansProMedium.woff2') format('woff2');font-weight:500;font-display:swap}

  :root{
    --tmm-field:var(--theme-website-color-5,#841519);
    --tmm-ink:#FFFFFF;
  }

  /* One field all the way down, so no white band shows under the section.
     div.bg-primary, not .bg-primary: the <header> carries that class too. */
  body,
  div.bg-primary,
  div.bg-secondary,
  .wb-bg-primary{background:var(--tmm-field) !important}

  /* Fill the screen and centre the content. 57px is Circle's header.
     Circle's own column padding is 112px, which fights the centring. */
  .wb-bg-secondary{min-height:calc(100dvh - 57px);display:flex;align-items:center}
  .wb-bg-secondary > .wb-max-w-7xl{width:100%}
  .wb-bg-secondary [class*="wb-py-12"]{
    padding-top:clamp(40px,7vw,64px) !important;
    padding-bottom:clamp(40px,7vw,64px) !important;
  }

  /* Balanced wrapping on every paragraph, so no line is left with one
     orphaned word. */
  .wb-bg-secondary p{text-wrap:balance}

  /* The line under the logo */
  [class*="wb-text-h6"],
  [class*="wb-text-h6"] p{
    color:var(--tmm-ink) !important;
    font-family:'TMM Sweet Sans','Work Sans',sans-serif !important;
    font-size:clamp(13px,3.6vw,16px) !important;
    font-weight:500 !important;
    letter-spacing:.2em !important;
    line-height:1.45 !important;
    text-transform:uppercase !important;
  }

  /* The two sentences */
  [class*="wb-text-p1"]{
    max-width:46ch;
    margin-inline:auto;
    color:var(--tmm-ink) !important;
    font-size:clamp(15px,4vw,17px) !important;
    line-height:1.6 !important;
  }
  [class*="wb-text-p1"] p+p{margin-top:.8em}
  [class*="wb-text-p1"] b,
  [class*="wb-text-p1"] strong{color:var(--tmm-ink) !important;font-weight:600}

  /* The two ways in. Both come off Circle's one secondary token set, so
     they are told apart by order — reorder them and Sign In stops being
     the filled one. */
  a[class*="wb-pt-button-secondary"]{
    min-height:50px;
    padding:12px 30px !important;
    border:1px solid var(--tmm-ink) !important;
    border-radius:999px !important;
    font-family:'TMM Sweet Sans','Work Sans',sans-serif !important;
    font-size:clamp(13px,3.4vw,15px) !important;
    font-weight:500 !important;
    letter-spacing:.18em !important;
    text-transform:uppercase !important;
    box-shadow:none !important;
    transition:background-color .22s ease,color .22s ease,border-color .22s ease;
  }
  a[class*="wb-pt-button-secondary"] p{
    font:inherit !important;
    letter-spacing:inherit !important;
    text-transform:inherit !important;
    color:inherit !important;
  }
  a[class*="wb-pt-button-secondary"]:first-child{
    background:var(--tmm-ink) !important;
    color:var(--tmm-field) !important;
  }
  a[class*="wb-pt-button-secondary"]:last-child{
    background:transparent !important;
    color:var(--tmm-ink) !important;
  }
  a[class*="wb-pt-button-secondary"]:hover{
    background:var(--tmm-ink) !important;
    border-color:var(--tmm-ink) !important;
    color:var(--tmm-field) !important;
  }
  a[class*="wb-pt-button-secondary"]:focus-visible{
    outline:2px solid var(--tmm-ink);
    outline-offset:3px;
  }

  @media (max-width:767px){
    a[class*="wb-pt-button-secondary"]{width:100%}
  }
</style>
