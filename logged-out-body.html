<!-- ============================================================
     TMM Signed-Out Door — logged-out-body.html

     One Circle Site Builder page serving two arrivals:
       • a member who just tapped Log out
       • anyone who reaches the community signed out

     Deliberately one screen with two ways in and nothing else to
     read. These people already know what this is; they are not
     being sold to, they are getting back in.

     Paste this whole block into a Custom HTML element. It is
     self-contained — its own <style>, markup and fonts — so there
     is NO head snippet and nothing to deploy. Every selector is
     scoped to .tmm-door, and the fonts come from Cloudflare Pages
     (CORS is open on /home/fonts/*), so Circle's CSS and this
     page's CSS cannot reach each other.

     The red field and cream type follow the App Store screens, so
     this matches what a member has just been looking at. Type is
     the splash system: display serif for the name, Sweet Sans
     uppercase at 0.2em for the line beneath it.

     Both buttons carry target="_top". Circle renders custom HTML
     in an iframe, and without it sign-in loads inside the block —
     the same trap as the /share page.

     No logo: Circle's own header shows the wordmark. If that ever
     changes, the inlined SVG lockup in splash-body.html drops in
     above the heading.

     CTA URLS — both set by the owner:
       Sign in  /sign_in#email
       Sign up  /signup  — which is the welcome/splash page, so it
                lands on the carousel and the membership cards.
                Hence the label "Sign Up" rather than "Join Free":
                the free tier is one choice there, not the only
                one, and a button should name where it goes.

     Do not swap in /join?invitation_token=… (as splash-body.html
     still does for its Explore button): that redirects to the
     sign-in page, so it cannot create an account.
     ============================================================ -->

<style>
  @font-face{font-family:'TMM Door Operetta';src:url('https://tmm-circle-assets.pages.dev/home/fonts/Operetta52-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
  @font-face{font-family:'TMM Door Sweet Sans';src:url('https://tmm-circle-assets.pages.dev/home/fonts/SweetSansProMedium.woff2') format('woff2');font-weight:500;font-display:swap}
  @font-face{font-family:'TMM Door Work Sans';src:url('https://tmm-circle-assets.pages.dev/home/fonts/WorkSans-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'TMM Door Work Sans';src:url('https://tmm-circle-assets.pages.dev/home/fonts/WorkSans-Medium.woff2') format('woff2');font-weight:500;font-display:swap}

  .tmm-door{
    --brand:#841519; --deep-brown:#5E0D11;
    --cream:#F4EDDB; --white:#F9F9F9; --sand:#EAE4D6;

    --font-display:'TMM Door Operetta',Georgia,serif;
    --font-head:'TMM Door Sweet Sans','TMM Door Work Sans',sans-serif;
    --font-body:'TMM Door Work Sans',system-ui,-apple-system,sans-serif;

    position:relative;
    background:var(--brand);
    color:var(--cream);
    font:16px/1.6 var(--font-body);
    -webkit-font-smoothing:antialiased;
    /* No vh units: Circle sizes this block to its content, and a viewport
       height inside a content-sized frame feeds back on itself. */
    padding:clamp(64px,13vw,120px) clamp(20px,5vw,32px);
    text-align:center;
  }
  .tmm-door *{box-sizing:border-box}
  .tmm-door ::selection{background:var(--cream);color:var(--brand)}

  .tmm-door__inner{max-width:34rem;margin:0 auto}

  .tmm-door__title{
    margin:0;
    color:var(--cream);
    font-family:var(--font-display);
    font-weight:500;
    font-size:clamp(36px,9vw,58px);
    letter-spacing:-.04em;
    line-height:1;
  }

  .tmm-door__standfirst{
    margin:16px auto 0;
    max-width:24rem;
    color:var(--cream);
    font-family:var(--font-head);
    font-weight:500;
    font-size:clamp(14px,3.9vw,17px);
    letter-spacing:.2em;
    line-height:1.4;
    text-transform:uppercase;
  }

  /* One short rule: identity above it, the practical part below. */
  .tmm-door__rule{
    width:40px;height:2px;margin:clamp(28px,6vw,36px) auto;
    background:var(--cream);border:0;opacity:.55;
  }

  .tmm-door__body{
    margin:0 auto;
    max-width:28rem;
    color:var(--sand);
    font-size:clamp(15px,4vw,17px);
    line-height:1.6;
  }
  .tmm-door__body + .tmm-door__body{margin-top:12px}
  .tmm-door__body b{color:var(--cream);font-weight:500}

  .tmm-door__actions{
    display:flex;flex-direction:column;align-items:stretch;
    gap:12px;margin:clamp(30px,6vw,38px) auto 0;max-width:22rem;
  }

  .tmm-door__btn{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:50px;padding:10px 28px;
    border:1px solid var(--cream);border-radius:999px;
    font-family:var(--font-head);font-weight:500;
    font-size:clamp(13px,3.4vw,15px);
    letter-spacing:.2em;text-indent:.2em;text-transform:uppercase;
    text-decoration:none;
    transition:background-color .22s cubic-bezier(.4,0,.2,1),
               color .22s cubic-bezier(.4,0,.2,1),
               transform .22s cubic-bezier(.4,0,.2,1);
  }
  .tmm-door__btn--primary{background:var(--cream);color:var(--brand)}
  .tmm-door__btn--primary:hover{background:var(--white)}
  .tmm-door__btn--secondary{background:transparent;color:var(--cream)}
  .tmm-door__btn--secondary:hover{background:var(--deep-brown);border-color:var(--deep-brown)}
  .tmm-door__btn:active{transform:translateY(1px)}
  .tmm-door__btn:focus-visible{outline:2px solid var(--cream);outline-offset:3px}

  @media (min-width:33rem){
    .tmm-door__actions{flex-direction:row;justify-content:center;max-width:none;gap:14px}
    .tmm-door__btn{flex:0 0 auto}
  }

  /* One authored moment: the page settles in from the top down, once. */
  .tmm-door__inner > *{animation:tmmDoorIn .62s cubic-bezier(.16,1,.3,1) backwards}
  .tmm-door__title{animation-delay:.04s}
  .tmm-door__standfirst{animation-delay:.12s}
  .tmm-door__rule{animation-delay:.2s}
  .tmm-door__body{animation-delay:.24s}
  .tmm-door__actions{animation-delay:.32s}
  @keyframes tmmDoorIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .tmm-door__inner > *{animation:none}
  }
</style>

<div class="tmm-door">
  <div class="tmm-door__inner">
    <h1 class="tmm-door__title">The Millionaire Mother</h1>
    <p class="tmm-door__standfirst">The community for ambitious mothers</p>

    <hr class="tmm-door__rule" aria-hidden="true">

    <p class="tmm-door__body">You&rsquo;re signed out. <b>Sign back in</b> for your resources, your live events, and the village.</p>
    <p class="tmm-door__body">Not a member yet? Sign up and choose your membership.</p>

    <div class="tmm-door__actions">
      <a class="tmm-door__btn tmm-door__btn--primary" href="https://members.themillionairemother.com/sign_in#email" target="_top">Sign In</a>
      <a class="tmm-door__btn tmm-door__btn--secondary" href="https://members.themillionairemother.com/signup" target="_top">Sign Up</a>
    </div>
  </div>
</div>
