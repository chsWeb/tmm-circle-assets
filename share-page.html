<!-- ============================================================
     /share — Airtable referral form, for a Circle Site Builder page.
     Paste into a Custom HTML / code block on that page.

     Self-contained on purpose: home.css is only loaded on the home
     screen, so the styles this needs live here.

     WHY FIXED HEIGHTS: a cross-origin iframe cannot tell the page how
     tall its content is, and Airtable does not report it. If the frame
     is shorter than the form, Airtable scrolls the form INSIDE the
     frame — the scrollbar-in-a-scrollbar we want to avoid. So the frame
     is set taller than the form and the page scrolls instead.

     MEASURED 28 Sept 2026 (form content height, by width):
         390px wide  -> 1352px tall   => frame 1500px  (148px headroom)
        1280px wide  -> 1134px tall   => frame 1250px  (116px headroom)
     Verified at both sizes: no scrollbars inside the frame.

     IF THE FORM CHANGES (fields added, or the column is narrowed) it
     gets taller and the inner scrollbar comes back. Re-measure then.
     Narrower = taller, so keep this full width in Site Builder.
     ============================================================ -->
<style>
  .tmm-share-page {
    margin: 0 auto;
    padding: 0;
  }

  .tmm-share-page__frame {
    display: block;
    width: 100%;
    height: 1500px;      /* phones: form needs 1352px at 390px wide */
    border: 0;
    background: #fff;
  }

  @media (min-width: 768px) {
    .tmm-share-page__frame {
      height: 1250px;    /* desktop: form needs 1134px at 1280px wide */
      border-radius: 12px;
    }
  }

  .tmm-share-page__fallback {
    display: block;
    margin: 12px 0 0;
    font-family: 'Work Sans', system-ui, -apple-system, sans-serif;
    font-size: 13px;
    color: #4D4D4D;
    text-align: center;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
</style>

<div class="tmm-share-page">
  <iframe class="tmm-share-page__frame"
          src="https://airtable.com/embed/appspZ48CnWo2Iisd/pagaEUjnuXCs6MaGy/form"
          title="Share MotherHub and enter to win"
          width="100%" height="1500"
          loading="lazy"></iframe>
  <a class="tmm-share-page__fallback" href="https://airtable.com/appspZ48CnWo2Iisd/pagaEUjnuXCs6MaGy/form" target="_blank" rel="noopener">Form not loading? Open it in a new tab</a>
</div>
