<!-- ============================================================
     TMM Welcome Splash — HEAD snippet

     Paste into the head of the Circle SITE BUILDER page that serves
     /signup. That is now the only surface: the App Builder screen
     was retired, because App Builder screens are members-only and
     Join has to work for people without an account. The branded iOS
     app opens this same Site Builder page in a webview.

     Files served from Cloudflare Pages (tmm-circle-assets repo).
     Both serve max-age=0, must-revalidate, so a deploy is picked up
     on the next load — ?v=N is belt-and-braces, not required.
     ============================================================ -->
<link rel="preconnect" href="https://tmm-circle-assets.pages.dev" crossorigin>
<link rel="stylesheet" href="https://tmm-circle-assets.pages.dev/tmm-experience-splash.css?v=39">
<script defer src="https://tmm-circle-assets.pages.dev/tmm-experience-splash.js?v=39"></script>

<!-- ------------------------------------------------------------
     HOST CHROME — now automatic, and normally left alone.

     Circle's page carries viewport-fit=cover, so the stylesheet
     reads env(safe-area-inset-top/bottom): zero in a browser, and
     the real status-bar and home-indicator insets inside the app's
     webview. No per-surface numbers to keep in sync.

     What it cannot see is Circle's own back-button header, which
     sits below the status bar and overlays the top of the page in
     the branded app. Nothing in CSS distinguishes that webview from
     mobile Safari, so the allowance is opt-in. If the progress bar
     is being clipped or blurred by that header, declare its height:

       :root { --tmm-app-header: 44px; }

     and, if the tab bar covers the foot of the page:

       :root { --tmm-app-footer: 56px; }

     To measure them, open this page in the app with ?tmmdebug=1 on
     the URL. A panel prints the safe-area insets, the viewport, the
     user agent and where the progress bar currently sits.
     ------------------------------------------------------------ -->
